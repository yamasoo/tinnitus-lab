name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # GitHub 的建置機器已經內建 Android SDK，直接使用；
      # 只補上這個專案需要的 API 36 平台（已經有就會略過）
      - name: Set up Android SDK
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKM="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1)"
          echo "SDK: $SDK"
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-36" "platform-tools"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK" > android/local.properties

      - name: Install packages
        run: |
          npm ci
          npx cap telemetry off

      - name: Prepare web content and sync
        run: |
          node scripts/prepare-www.js
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v6
        with:
          name: TinnitusLab-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
